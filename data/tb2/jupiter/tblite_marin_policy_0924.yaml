# OpenThoughts-TBLite 2.0 (harbor registry openthoughts-tblite v2.0: 100 tasks from open-thoughts/OpenThoughts-TBLite @ f075e463)
# on Daytona from a Jupiter login node, under the Marin Eval Policy of 2026-09-24 (marin-community/marin#9409; its durable
# harbor-configs/ot-tblite-recovery.yaml in the HF dataset open-athena/marin-eval-policy-2026-09-24, which differs from its
# tb2-recovery.yaml only in the dataset line). This file is tb2_marin_policy_0924.yaml with exactly one change:
#   - the task tree: the staged local copy /e/fscratch/reformo/lee27/tasks/openthoughts_tblite_2_0 (the 100 registry tasks at
#     f075e463, README beside it) instead of terminal_bench_2. run_tb2.sh replaces `datasets` with the explicit task list.
# Everything else is the TB2 0924 file, so read its header for the policy values (1800 s agent budget, setup 360 s, verifier
# 300 s, the 09-24 retry list, 16 concurrent, 32,768 / 8,192 tokens, thinking at the model default, no sampler override,
# harbor 761fb516) and our standing settings (auto_snapshot, skip_special_tokens=false, EAGLE-3 draft, DP4 on one node,
# trajectory_config.raw_content logging only).
# Snapshots (2026-09-28): 92 tasks resolve to Daytona global snapshots; the other 8 were built once by our key into the eval
# org (harbor__<hash>__snapshot, the name harbor derives); tasks without a snapshot go in EXCLUDE_TASKS (infra losses).
#
# run_tb2.sh fills __JOB_NAME__ and __API_BASE__.
job_name: __JOB_NAME__
jobs_dir: /e/data1/mmlaion/lee27/experiments/tb2_jobs
n_attempts: 1
n_concurrent_trials: 16
timeout_multiplier: 1.0
quiet: true
release_trial_payloads_in_memory: true
retry:
  max_retries: 10
  include_exceptions:
    - InternalServerError
    - APIConnectionError
    - APITimeoutError
    - ArtifactUploadTimeoutError
    - ArtifactWriterBacklogError
    - CancelledError
    - ContextManagementInfrastructureError
    - LLMRequestTimeoutError
    - SandboxBuildFailedError
    - ContainerRegistryThrottledError
    - AgentSetupTimeoutError
    - DaytonaSandboxStopError
    - DaytonaProcessError
    - TrialTimeoutError
    - ArtifactWriteTimeoutError
    - Tau3RuntimeInfrastructureError
    - Tau3TargetInfrastructureError
  exclude_exceptions: []
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
environment:
  type: daytona
  force_build: false
  kwargs:
    auto_snapshot: true
agents:
  - name: terminus-2
    model_name: hosted_vllm/snowball
    override_setup_timeout_sec: 360
    override_timeout_sec: 1800
    kwargs:
      api_base: __API_BASE__
      # the policy's standalone --ak model_info, verbatim
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 8192
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
      extra_body:
        skip_special_tokens: false
      trajectory_config:
        raw_content: true
verifier:
  override_timeout_sec: 300
datasets:
  - path: /e/fscratch/reformo/lee27/tasks/openthoughts_tblite_2_0
