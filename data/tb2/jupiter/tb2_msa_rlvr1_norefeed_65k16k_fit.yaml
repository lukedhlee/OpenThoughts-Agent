# MSA2 no-refeed evaluation of RLVR1 base and both matched CalibForge SFT arms.
# Explicit reply limit: 16,384 tokens; server context: 65,536 tokens.
# _fit (2026-10-18): identical except llm_kwargs.fit_max_tokens_to_context (harbor lukedhlee/msa-fit-max-tokens):
# each call asks for min(16,384, 65,536 - prompt tokens), so prompts may grow past 49,152 instead of ending the trial.
job_name: __JOB_NAME__
jobs_dir: /e/data1/mmlaion/lee27/experiments/tb2_jobs
n_attempts: 1
n_concurrent_trials: 16
timeout_multiplier: 1.0
quiet: true
release_trial_payloads_in_memory: true
retry:
  max_retries: 10
  include_exceptions:
    - InternalServerError
    - APIConnectionError
    - APITimeoutError
    - ArtifactUploadTimeoutError
    - ArtifactWriterBacklogError
    - CancelledError
    - ContextManagementInfrastructureError
    - LLMRequestTimeoutError
    - SandboxBuildFailedError
    - ContainerRegistryThrottledError
    - AgentSetupTimeoutError
    - DaytonaSandboxStopError
    - DaytonaProcessError
    - TrialTimeoutError
    - ArtifactWriteTimeoutError
    - Tau3RuntimeInfrastructureError
    - Tau3TargetInfrastructureError
  exclude_exceptions: []
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
environment:
  type: daytona
  force_build: false
  kwargs:
    auto_snapshot: true
agents:
  - name: mini-swe-agent-host
    model_name: hosted_vllm/snowball
    override_setup_timeout_sec: 360
    override_timeout_sec: 1800
    kwargs:
      config_file: mini.yaml
      model_class: litellm
      llm_kwargs:
        fit_max_tokens_to_context: true
      llm_call_kwargs:
        tool_choice: "none"
        max_tokens: 16384
      api_base: __API_BASE__
      model_info:
        max_input_tokens: 65536
        max_output_tokens: 16384
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
      extra_body:
        skip_special_tokens: false
      interleaved_thinking: false
verifier:
  override_timeout_sec: 300
datasets:
  - path: /e/fscratch/reformo/lee27/tasks/terminal_bench_2
