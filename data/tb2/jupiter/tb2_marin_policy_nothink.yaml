# tb2_marin_policy_nothink.yaml: tb2_marin_policy.yaml (Eval Policy v0.1) plus one change, enable_thinking=false on every
# request, so Grug Datakit SFT checkpoints render "Reasoning: /nothink" (their template defaults to /think). Datakit SFT
# learned Terminus-2 JSON only under /nothink with the think stripped (Will Held, 2026-09-22; the 09-20 run in /think
# answered in <tool_call> format and scored SWE 4/100, TB2 0/89).
# Terminal-Bench 2 on Daytona from a Jupiter login node, under Marin Eval Policy v0.1 (marin-community/marin#9193,
# 2026-09-16; its pinned tb2-recovery.yaml at marin 8aa9a354): terminus-2, Daytona, 16 concurrent trials, the v0.1 retry
# list, 1 trial per task, 32,768 input / 8,192 output tokens, the HF dataset DCAgent2/terminal_bench_2 (byte-identical to
# laude-institute/terminal-bench-2 @ 69671fba, checked 09-17). v0.1 sets no sampler: the server serves its defaults.
#
# Snapshots: none of ours. Daytona holds a global snapshot for 88 of the 89 tasks under harbor's own name
# harbor__<hash of environment dir>__snapshot, so auto_snapshot resolves them without creating anything; the one
# missing task (train-fasttext) is built once by our key on first use and then reused (one of the org's 40 slots).
#
# run_tb2.sh fills __JOB_NAME__ and __API_BASE__.
job_name: __JOB_NAME__
jobs_dir: /e/data1/mmlaion/lee27/experiments/tb2_jobs
n_attempts: 1
n_concurrent_trials: 16
timeout_multiplier: 1.0
quiet: true
release_trial_payloads_in_memory: true
retry:
  max_retries: 10
  include_exceptions:
    - InternalServerError
    - APIConnectionError
    - APITimeoutError
    - ArtifactUploadTimeoutError
    - ArtifactWriterBacklogError
    - CancelledError
    - ContextManagementInfrastructureError
    - LLMRequestTimeoutError
    - SandboxBuildFailedError
    - TrialTimeoutError
  exclude_exceptions: []
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
environment:
  type: daytona
  force_build: false
  kwargs:
    auto_snapshot: true
agents:
  - name: terminus-2
    model_name: hosted_vllm/snowball
    kwargs:
      api_base: __API_BASE__
      # the v0.1 budgets, verbatim from the issue's standalone block
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 8192
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
      # the one Snowball-specific setting: its think delimiters are special tokens and marin's snowball entries keep them
      # (skip_special_tokens=false); everything else is harbor 7b18505a's default, including summarization (on, 8,000 free tokens)
      extra_body:
        skip_special_tokens: false
        chat_template_kwargs:
          enable_thinking: false
datasets:
  - path: /e/fscratch/reformo/lee27/tasks/terminal_bench_2
