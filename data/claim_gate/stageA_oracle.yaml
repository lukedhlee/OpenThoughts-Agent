# Claim gate, stage A: does `harbor jobs start` run R2E-Gym tasks through the Jupiter apptainer bridge (JUWELS fleet)?
# Oracle agent on 8 train tasks; every trial should score 1. run_stageA.sh fills job_name/jobs_dir/tasks.
job_name: __JOB_NAME__
jobs_dir: __JOBS_DIR__
n_attempts: 1
n_concurrent_trials: 8
timeout_multiplier: 1.0
quiet: true
environment:
  type: apptainer
  force_build: false
  delete: true
  override_cpus: 2
  override_memory_mb: 4096
  override_storage_mb: 4096
  kwargs:
    bridge_url: http://127.0.0.1:9930
agents:
- name: oracle
tasks: []
