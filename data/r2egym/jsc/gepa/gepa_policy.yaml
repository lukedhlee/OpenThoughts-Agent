# gepa_policy.yaml — the harbor policy for one GEPA candidate shard, run from a Jupiter login node against the
# standing serve job on the Daytona backend.
#
# THE CONTRACT IS THE RL ONE: 61,440 input / 4,096 output, summarization explicitly OFF (Luke, 2026-09-21). That is
# what the RL arms roll out under, so it is what the loop searches under. A guidance block is being found in order
# to shape rollouts, and a block searched under a different context budget and a different context-management
# policy is a block found for a different agent.
#
# Everything structural stays aligned with Marin Eval Policy v0.1, checked field by field against a real v0.1 run
# (tb2_jobs/otabaseswe_v01_20260919): the retry list, the Daytona environment block with auto_snapshot,
# timeout_multiplier 1.0, quiet, release_trial_payloads_in_memory, one attempt per task, and
# skip_special_tokens=false so Snowball's think delimiters survive the round trip. Only the two token budgets and
# the summarization flag differ from v0.1, deliberately.
#
# ⚠ THE FINAL SWE-100 / TB2 COMPARISON RUNS UNDER EVAL POLICY v0.1 (32,768 / 8,192, summarization ON), so the
# winning block is validated under the RL contract here and read once under the eval contract at the end.
#
# Two further deviations from the v0.1 run, both infrastructure rather than agent behaviour:
#   jobs_dir            gepa_jobs instead of tb2_jobs, so GEPA runs never mix with the eval runs
#   n_concurrent_trials set per shard by gepa_runner.py to the server's seat count (32) rather than v0.1's 16.
#                       Every concurrent trial still owns a seat on its own server, and the agent timeout resolves
#                       to 3,000 s against turns that take seconds, so this changes throughput and not what a
#                       trial does. Set CONC=16 if an exactly-v0.1 layout is ever wanted.
# The harbor is code/harbor-hook rather than the 7b18505a v0.1 pin, because the R2E-Gym Daytona tasks need the
# setup_files/setup.sh hook. Its terminus-2 carries the same defaults as the pin (enable_summarize True,
# proactive_summarization_threshold 8000, checked 2026-09-21), which is why the flag below has to be set
# explicitly rather than left out.
#
# Expect a LOT of context death, and do not read it as a bug. With summarization off, the control arm of the
# p2o6all probe ended ~72 % of its trials on ContextLengthExceededError at exactly these budgets, and a 32,768-token
# SWE run with summarization off ended 100 % of the trials sampled that way. That is why `no_ctx_death` is one of
# the eight Pareto axes: at this contract it is the single biggest thing a guidance block can move, and block A
# moved it +0.17 in the fixture.
#
# gepa_run.sh fills __JOB_NAME__, __API_BASE__, __CONC__, __ATTEMPTS__ and the task list.
job_name: __JOB_NAME__
jobs_dir: /e/data1/mmlaion/lee27/experiments/gepa_jobs
n_attempts: __ATTEMPTS__
n_concurrent_trials: __CONC__
timeout_multiplier: 1.0
quiet: true
release_trial_payloads_in_memory: true
retry:
  max_retries: 10
  include_exceptions:
    - InternalServerError
    - APIConnectionError
    - APITimeoutError
    - ArtifactUploadTimeoutError
    - ArtifactWriterBacklogError
    - CancelledError
    - ContextManagementInfrastructureError
    - LLMRequestTimeoutError
    - SandboxBuildFailedError
    - TrialTimeoutError
  exclude_exceptions: []
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
environment:
  type: daytona
  force_build: false
  kwargs:
    auto_snapshot: true
agents:
  - name: terminus-2
    model_name: hosted_vllm/snowball
    kwargs:
      api_base: __API_BASE__
      # terminus-2 defaults to summarization ON, so OFF has to be stated. Leaving this out silently gives the
      # eval policy's context management, which is not what the RL arms run.
      enable_summarize: false
      model_info:
        max_input_tokens: 61440
        max_output_tokens: 4096
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
      extra_body:
        skip_special_tokens: false
