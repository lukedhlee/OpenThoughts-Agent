job_name: __JOB_NAME__
jobs_dir: __JOBS_DIR__
n_attempts: 1
n_concurrent_trials: __CONC__
timeout_multiplier: 1.0
agent_timeout_multiplier: __AGENT_MULT__
environment_build_timeout_multiplier: 4.0
quiet: true
release_trial_payloads_in_memory: true
retry:
  max_retries: 3
  include_exceptions:
  - DaytonaRateLimitError
  - EnvironmentStartTimeoutError
  - DaytonaSandboxStopError
  - SetupScriptError
  - SandboxBuildFailedError
  - ArtifactUploadTimeoutError
  - ArtifactWriterBacklogError
  exclude_exceptions: []
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
environment:
  force_build: false
  delete: true
  override_cpus: 2
  override_memory_mb: 4096
  override_storage_mb: 10240
  kwargs: {}
  import_path: data.relay.horizon.fresh_msa_runtime:ExistingCalibforgeSnapshot
agents:
- name: mini-swe-agent-host
  model_name: hosted_vllm/relay
  kwargs:
    config_file: mini.yaml
    model_class: litellm
    llm_call_kwargs:
      tool_choice: none
      max_tokens: 16384
    api_base: __API_BASE__
    model_info:
      max_input_tokens: __MAX_INPUT__
      max_output_tokens: __MAX_OUTPUT__
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    extra_body:
      skip_special_tokens: false
    interleaved_thinking: true
    llm_session_header: X-Harbor-Session-Id
    llm_kwargs:
      fit_max_tokens_to_context: true
tasks: []
