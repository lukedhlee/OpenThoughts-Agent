# PedaGEPA eval database registry: the provenance that is NOT in the harbor job dirs (which model, how it was served,
# which harness commit, who ran it). Everything else (the full harbor job config, per-trial results, hard facts,
# judgments) is read from disk by evaldb.py. Add one entry per run; rebuild with `evaldb.py build`.
X: /e/data1/mmlaion/lee27/experiments

models:
  snowball-0921:
    role: student
    hf: open-athena/Grug-67B-A2B-Datakit-SFT-262K-2026.09.21
    path: /e/data1/mmlaion/lee27/models/grug-datakit-sft-20260921
    arch: Snowball 67B-A2B MoE (Grug), Datakit SFT 2026-09-21
    served_name: snowball
    engine: vLLM (marin fork, code/src/marin_vllm_eagle3 overlay, env snowball-v2)
    spec_decode: EAGLE-3 draft /e/data1/mmlaion/lee27/eagle3/probe_adapt_20260911/checkpoints/3, 3 speculative tokens
    parallel: TP1 x DP4 x EP4, one GH200 node (4 GPUs), 32 seqs per replica
    max_model_len: 65536
    sampling: {temperature: 1.0, top_p: 1.0, top_k: -1}   # POLICY=trained
    chat_template: the model's own chat_template.jinja
    thinking: template default (/think on); think spans inside content (<|start_think|> ... <|end_think|>)
    reasoning_parser: none
    request_extra: {skip_special_tokens: false}
  qwen38-27b:
    role: teacher
    hf: Qwen/Qwen3.8-27B
    path: /e/data1/mmlaion/lee27/models/Qwen3.8-27B
    arch: Qwen3.8 27B dense
    served_name: qwen38
    engine: vLLM (env snowball-v2 + relay-extra torchvision)
    spec_decode: MTP, 2 speculative tokens
    parallel: TP1; DP4 on one node, or one TP1 server per GPU (PER_GPU=1) - see each run
    max_model_len: 131072 (runs in this DB)
    sampling: the model's generation_config (no override)
    chat_template: default
    thinking: on (default); reasoning returned separately via --reasoning-parser qwen3
    reasoning_parser: qwen3
    request_extra: {}

# benchmark ids: calibforge-heldout300, tb2.1, tb2.0, swe100, calibforge-msa8, tb2.0-msa-smoke10
runs:
  - id: cf300_0921_6516
    benchmark: calibforge-heldout300
    model: snowball-0921
    jobs_dir: ${X}/relay_pilot_jobs/heldout6516_0921_20260928_student_only
    harness: terminus-2
    harness_commit: marin-community/harbor lukedhlee/terminus2-relay @ 89098635
    policy: 65,536 input / 16,384 output, summarization off, agent budget = task timeout (wall clock), Daytona
    routing: relay_router --mode student (student_only arm); the model's think spans stripped from later history
    refeed_reasoning: false
    serve: {job: 2109233, nodes: 1, node_hours: 1.22, layout: one DP4 server}
    run_dir: /e/fscratch/reformo/lee27/experiments/relay/pilot/runs/heldout6516_0921_20260928
    collected_by: Teacher Replay SFT session, 2026-09-28
