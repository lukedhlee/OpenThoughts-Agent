<title>Runboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --good-text: #006300;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --st-good: #0ca30c;
    --st-warn: #fab219;
    --st-serious: #ec835a;
    --st-critical: #d03b3b;
    --track-alpha: 0.18;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --good-text: #0ca30c;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --good-text: #0ca30c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 26px 20px 64px; display: flex; flex-direction: column; gap: 26px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .brand { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-right: auto; }
  select, .btn {
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 10px; cursor: pointer;
  }
  select:focus-visible, .btn:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

  header .eyebrow { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  header h1 { font-size: 30px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
  header .sub { color: var(--ink-2); font-size: 14.5px; max-width: 68ch; margin: 0; }
  header .snapline { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .live-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); background: var(--surface); }
  .live-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st-good); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .card h2 { font-size: 15px; font-weight: 650; margin: 0 0 2px; }
  .card .how { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; max-width: 78ch; }

  .tiles { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 820px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
  .tile .detail { font-size: 12px; color: var(--ink-2); }
  .tile.hero .value { font-size: 52px; line-height: 1.05; }
  .tile .delta { font-size: 14px; font-weight: 650; color: var(--good-text); }

  .explain p { margin: 0 0 8px; font-size: 14px; color: var(--ink-2); max-width: 78ch; }
  .explain p strong { color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; color: var(--ink-2); }

  .fleet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 820px) { .fleet { grid-template-columns: 1fr 1fr; } }
  .arm-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; display: flex; flex-direction: column; gap: 7px; }
  .arm-head { display: flex; align-items: center; gap: 8px; }
  .arm-key { width: 14px; height: 4px; border-radius: 2px; flex: none; }
  .arm-name { font-weight: 650; font-size: 14px; }
  .state-pill { margin-left: auto; font-size: 10.5px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
  .state-pill.run { color: var(--good-text); }
  .arm-meta { font-size: 12px; color: var(--ink-2); }
  .arm-meta .mono { font-size: 11.5px; }
  .meter { position: relative; height: 6px; border-radius: 3px; overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
  .meter-cap { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 2px 0 10px; }
  .lg { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .lg .key { width: 16px; height: 3px; border-radius: 1.5px; }
  .lg .diamond { font-size: 11px; color: var(--muted); }

  .chart-holder { position: relative; }
  .chart-holder svg { display: block; width: 100%; height: auto; }
  .chart-holder:focus-visible { outline: 2px solid var(--s1); outline-offset: 3px; border-radius: 6px; }
  .tt { position: absolute; pointer-events: none; z-index: 5; display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 150px; box-shadow: 0 4px 14px rgba(0,0,0,0.14); }
  .tt .tt-step { color: var(--muted); font-size: 11px; margin-bottom: 5px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .tt .row { display: flex; align-items: center; gap: 7px; padding: 1.5px 0; }
  .tt .row .key { width: 12px; height: 3px; border-radius: 1.5px; flex: none; }
  .tt .row .val { font-weight: 650; font-variant-numeric: tabular-nums; }
  .tt .row .nm { color: var(--ink-2); font-size: 11.5px; }
  .smalls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 820px) { .smalls { grid-template-columns: 1fr; } }

  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg .tick { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  svg .gridline { stroke: var(--grid); stroke-width: 1; }
  svg .axisline { stroke: var(--baseline); stroke-width: 1; }
  svg .endlabel { font-size: 11px; font-weight: 600; fill: var(--ink-2); }
  svg .evallabel { font-size: 10.5px; font-weight: 600; fill: var(--ink-2); }
  svg .crosshair { stroke: var(--baseline); stroke-width: 1; }

  .gloss { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 820px) { .gloss { grid-template-columns: 1fr; } }
  .g-item { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
  .g-item h3 { font-size: 13px; margin: 0 0 4px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .g-item h3 .wkey { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 400; font-size: 10.5px; color: var(--muted); }
  .g-item p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

  .fates { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 14px; }
  .fate-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px; }
  .fate-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .fate-chip .glyph { font-size: 11px; color: var(--ink-2); }
  .fate-chip b { color: var(--ink); font-variant-numeric: tabular-nums; }

  details { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: var(--surface); }
  details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  details summary:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  .tbl-wrap { overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; font-size: 12px; width: 100%; min-width: 640px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid); }
  td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--grid); color: var(--ink-2); font-variant-numeric: tabular-nums; vertical-align: top; }
  td.num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; white-space: nowrap; }
  td .fdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }

  footer { color: var(--muted); font-size: 12.5px; }
  footer p { margin: 4px 0; max-width: 80ch; }
  footer b { color: var(--ink-2); }
  a { color: inherit; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .dropping::after { content: "Drop experiment JSON to load"; position: fixed; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 650; color: var(--ink); background: color-mix(in srgb, var(--page) 82%, transparent); border: 3px dashed var(--baseline); z-index: 50; }

  @media (prefers-reduced-motion: no-preference) {
    .live-pill .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  }
</style>

<div class="wrap">
  <div class="topbar">
    <span class="brand">Runboard</span>
    <select id="exp-select" aria-label="Experiment"></select>
    <button class="btn" id="load-btn" type="button">Load JSON…</button>
    <input type="file" id="load-input" accept=".json,application/json" style="display:none" multiple>
  </div>
  <div id="app"></div>
</div>

<script>
"use strict";
/* Runboard — generic experiment dashboard.
   Data contract: window.EXPERIMENTS = [experiment, ...]; see scripts/dashboard/README.md.
   New experiments load three ways: rebuild the bundle, use the Load JSON button, or
   drag a JSON onto the page (loaded ones persist in localStorage). */
const EXPERIMENTS = __EXPERIMENTS_JSON__;

const SLOTS = 8;
const FATES = {
  hang: { label: "collective hang",     glyph: "◼", color: "var(--st-warn)" },
  oom:  { label: "out of memory",       glyph: "▲", color: "var(--st-critical)" },
  node: { label: "sick node / OS kill", glyph: "✕", color: "var(--st-serious)" },
  fail: { label: "failed",              glyph: "✕", color: "var(--st-critical)" },
  done: { label: "completed",           glyph: "●", color: "var(--st-good)" },
  run:  { label: "training now",        glyph: "●", color: "var(--st-good)" },
};

const RL_CHARTS = [
  { field: "reward", title: "Training reward by step", big: true, dp: 2, y0: 0, y1: 1, yTicks: [0, 0.25, 0.5, 0.75, 1],
    how: "Each line = one run's share of correct answers on its training batch. Up and to the right = learning. Diamonds ◆ are held-out evals — the honest scoreboard. Hover or focus + arrow keys for exact values." },
  { field: "entropy", title: "Entropy — is anyone collapsing?", dp: 2,
    how: "Token-level hesitation. Drifting down = converging (fine). Crashing toward ~0.01 = mode collapse, the kill criterion." },
  { field: "kl", title: "KL to reference — how far from base?", dp: 3,
    how: "Drift from the frozen starting model, kept small by the KL penalty. Runs trained without a KL loss have no reference model and no line here." },
  { field: "len50", title: "Answer length (median tokens)", dp: 0,
    how: "Median tokens per sampled answer. Watch for runaway growth (rambling) or a crash to near-zero (degenerate short outputs)." },
  { field: "mixed", title: "Mixed groups — is there signal left?", dp: 2, y0: 0, y1: 1, yTicks: [0, 0.25, 0.5, 0.75, 1],
    how: "Share of questions where the samples disagree — the only place GRPO gradient comes from. Falls as the training set is mastered." },
];

const RL_GLOSSARY = [
  { term: "Train reward", wkey: "reward/avg_raw_reward", text: "Of the answers sampled per training question, the fraction judged correct. Training-set accuracy at sampling temperature. This going up is the whole point." },
  { term: "Eval accuracy ◆", wkey: "eval/all/avg_score", text: "One greedy answer per held-out question, strictly scored. The honest scoreboard — mind the confidence interval before celebrating small moves." },
  { term: "pass@k", wkey: "reward/avg_pass_at_8", text: "A question counts if any of the k samples solved it. The gap between pass@k and train reward is the headroom RL can still convert into first-try accuracy." },
  { term: "Entropy", wkey: "policy/policy_entropy", text: "Per-token hesitation; 0 = always certain. A slow slide is convergence. A crash to ~0.01 is collapse — the model repeating one pattern forever." },
  { term: "KL to reference", wkey: "policy/policy_kl", text: "Distance from the frozen starting model. Kept small by a penalty so the model improves without forgetting how to be a language model." },
  { term: "Gradient norm", wkey: "policy/raw_grad_norm", text: "Raw size of each update before clipping. Steady single digits = healthy. Sustained explosion = instability." },
  { term: "Mixed groups", wkey: "diag/frac_groups_mixed", text: "Share of questions where the samples disagree — the only source of GRPO gradient. All-right and all-wrong groups contribute nothing." },
  { term: "Truncated share", wkey: "diag/truncated_frac", text: "Answers that hit the generation cap mid-thought. A few percent is cosmetic; tens of percent burns compute on rambling." },
  { term: "TIS ratio", wkey: "policy/tis/imp_ratio_mean", text: "Agreement between the two copies of the model (the generator and the trainer). ≈1.00 means weight sync is working." },
  { term: "Clip ratio", wkey: "policy/ppo_clip_ratio", text: "Fraction of tokens whose update PPO had to clip this step. Small means the policy moves in measured steps rather than lurching." },
];

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function svgEl(tag, attrs) { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function fmt(v, dp) { return v == null ? "—" : Number(v).toFixed(dp == null ? 3 : dp); }
function mins(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
function slotVar(slot) { return `var(--s${((slot - 1) % SLOTS) + 1})`; }
/* **bold** spans → <strong>, everything else as text nodes (no innerHTML). */
function mdBold(target, s) {
  String(s).split("**").forEach((part, i) => {
    if (i % 2) target.append(el("strong", null, part)); else target.append(document.createTextNode(part));
  });
}
function keySpan(color, cls) { const k = el("span", cls || "key"); k.style.background = color; return k; }

/* ---------- nice y-scale for charts without explicit domains ---------- */
function niceScale(lo, hi) {
  if (!(isFinite(lo) && isFinite(hi))) { lo = 0; hi = 1; }
  if (lo > 0 && lo < hi * 0.4) lo = 0;
  if (lo === hi) hi = lo + 1;
  const span = hi - lo;
  const raw = span / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= 5.5) || 10 * mag;
  const y0 = Math.floor(lo / step) * step;
  const y1 = Math.ceil(hi / step) * step;
  const ticks = [];
  for (let t = y0; t <= y1 + step / 1e6; t += step) ticks.push(+t.toPrecision(10));
  return { y0, y1, ticks };
}

/* ---------- generic line chart ---------- */
function lineChart(holder, exp, spec) {
  const seriesPts = exp.series_meta.map(sm => ({
    sm,
    pts: (exp.series_data[sm.key] || []).filter(r => r[spec.field] != null).map(r => [r.step, r[spec.field]]),
  }));
  if (!seriesPts.some(s => s.pts.length)) { holder.append(el("p", "how", "No data for this metric yet.")); return; }

  const maxStep = Math.max(...seriesPts.flatMap(s => s.pts.map(p => p[0])), 1);
  const x0 = 0, x1 = spec.x1 || Math.ceil(maxStep * 1.09);
  const xStep = spec.xStep || Math.max(1, Math.ceil((x1 - x0) / (spec.big ? 9 : 4.5) / 5) * 5);
  let y0 = spec.y0, y1 = spec.y1, yTicks = spec.yTicks;
  if (y0 == null || y1 == null || !yTicks) {
    const vals = seriesPts.flatMap(s => s.pts.map(p => p[1]))
      .concat((spec.evals || []).map(e => e.v));
    const ns = niceScale(Math.min(...vals), Math.max(...vals));
    y0 = y0 == null ? ns.y0 : y0; y1 = y1 == null ? ns.y1 : y1; yTicks = yTicks || ns.ticks;
  }

  const W = 1000, H = spec.big ? 360 : 240;
  const M = { l: 50, r: spec.big ? 96 : 30, t: 14, b: 30 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const x = s => M.l + iw * (s - x0) / (x1 - x0);
  const y = v => M.t + ih * (1 - (v - y0) / (y1 - y0));
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" });

  for (const t of yTicks) {
    svg.append(svgEl("line", { x1: M.l, x2: W - M.r, y1: y(t), y2: y(t), class: "gridline" }));
    const lb = svgEl("text", { x: M.l - 8, y: y(t) + 3.5, "text-anchor": "end", class: "tick" });
    lb.textContent = spec.yFmt === "int" ? String(Math.round(t)) : String(+t.toPrecision(6));
    svg.append(lb);
  }
  svg.append(svgEl("line", { x1: M.l, x2: W - M.r, y1: y(y0), y2: y(y0), class: "axisline" }));
  for (let t = x0; t <= x1; t += xStep) {
    const lb = svgEl("text", { x: x(t), y: H - 8, "text-anchor": "middle", class: "tick" });
    lb.textContent = t; svg.append(lb);
  }
  const xcap = svgEl("text", { x: W - 4, y: H - 8, "text-anchor": "end", class: "tick" });
  xcap.textContent = "step"; svg.append(xcap);

  for (const s of seriesPts) {
    if (!s.pts.length) continue;
    const color = slotVar(s.sm.color_slot);
    const d = s.pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");
    svg.append(svgEl("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = s.pts[s.pts.length - 1];
    svg.append(svgEl("circle", { cx: x(last[0]), cy: y(last[1]), r: 6.5, fill: "var(--surface)" }));
    svg.append(svgEl("circle", { cx: x(last[0]), cy: y(last[1]), r: 4.5, fill: color }));
  }

  if (spec.big) {
    const placed = [];
    const items = seriesPts.filter(s => s.pts.length)
      .map(s => ({ s, lx: x(s.pts[s.pts.length - 1][0]) + 10, ly: y(s.pts[s.pts.length - 1][1]) }))
      .sort((p, q) => p.ly - q.ly);
    for (const it of items) {
      let ly = it.ly + 4;
      for (const p of placed) if (Math.abs(ly - p) < 14) ly = p + 14;
      placed.push(ly);
      const lab = svgEl("text", { x: it.lx, y: ly, class: "endlabel" });
      lab.textContent = it.s.sm.name + " " + fmt(it.s.pts[it.s.pts.length - 1][1], spec.dp);
      svg.append(lab);
    }
  }

  for (const ev of spec.evals || []) {
    const px = x(ev.step), py = y(ev.v);
    const color = ev.series ? slotVar((exp.series_meta.find(m => m.key === ev.series) || {}).color_slot || 1) : "var(--muted)";
    svg.append(svgEl("path", { d: `M ${px} ${py - 7} L ${px + 6.5} ${py} L ${px} ${py + 7} L ${px - 6.5} ${py} Z`, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));
    const lab = svgEl("text", { x: px + (ev.dx == null ? 10 : ev.dx), y: py + (ev.dy == null ? 4 : ev.dy), class: "evallabel" });
    lab.textContent = ev.label; svg.append(lab);
  }

  const cross = svgEl("line", { y1: M.t, y2: M.t + ih, class: "crosshair", visibility: "hidden" });
  svg.append(cross);
  holder.append(svg);
  const tt = el("div", "tt");
  holder.append(tt);

  const allSteps = [...new Set(seriesPts.flatMap(s => s.pts.map(p => p[0])))].sort((a, b) => a - b);
  let curIdx = -1;
  function showAt(idx, px) {
    if (!allSteps.length) return;
    curIdx = Math.max(0, Math.min(allSteps.length - 1, idx));
    const step = allSteps[curIdx];
    cross.setAttribute("x1", x(step)); cross.setAttribute("x2", x(step));
    cross.setAttribute("visibility", "visible");
    tt.textContent = "";
    tt.append(el("div", "tt-step", "step " + step));
    for (const s of seriesPts) {
      const pt = s.pts.find(p => p[0] === step);
      const row = el("div", "row");
      row.append(keySpan(slotVar(s.sm.color_slot)));
      row.append(el("span", "val", pt ? fmt(pt[1], spec.dp) : "—"));
      row.append(el("span", "nm", s.sm.name));
      tt.append(row);
    }
    tt.style.display = "block";
    const hw = holder.clientWidth;
    const fx = (px != null ? px : x(step) * hw / W);
    tt.style.left = Math.min(Math.max(fx + 14, 4), hw - 170) + "px";
    tt.style.top = "18px";
  }
  function hide() { cross.setAttribute("visibility", "hidden"); tt.style.display = "none"; curIdx = -1; }
  holder.addEventListener("pointermove", e => {
    const r = holder.getBoundingClientRect();
    const sx = (e.clientX - r.left) * W / r.width;
    let best = 0, bd = Infinity;
    allSteps.forEach((s, i) => { const d = Math.abs(x(s) - sx); if (d < bd) { bd = d; best = i; } });
    showAt(best, e.clientX - r.left);
  });
  holder.addEventListener("pointerleave", hide);
  holder.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { showAt(curIdx < 0 ? 0 : curIdx + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { showAt(curIdx < 0 ? allSteps.length - 1 : curIdx - 1); e.preventDefault(); }
    else if (e.key === "Escape") hide();
  });
  holder.addEventListener("blur", hide);
}

function legendRow(exp, withEvalKey) {
  const row = el("div", "legend");
  for (const sm of exp.series_meta) {
    const g = el("span", "lg");
    g.append(keySpan(slotVar(sm.color_slot)), el("span", null, sm.name + (sm.label ? " · " + sm.label : "")));
    row.append(g);
  }
  if (withEvalKey && exp.eval_key_label) {
    const ev = el("span", "lg");
    ev.append(el("span", "diamond", "◆"), el("span", null, exp.eval_key_label));
    row.append(ev);
  }
  return row;
}

/* ---------- sections ---------- */
function renderHeader(exp) {
  const h = el("header");
  if (exp.eyebrow) h.append(el("div", "eyebrow", exp.eyebrow));
  h.append(el("h1", null, exp.title));
  if (exp.subtitle) { const p = el("p", "sub"); mdBold(p, exp.subtitle); h.append(p); }
  const snap = el("div", "snapline");
  if (exp.status_line) {
    const pill = el("span", "live-pill");
    pill.append(el("span", "dot"), document.createTextNode(exp.status_line));
    snap.append(pill);
  }
  if (exp.snapshot) snap.append(el("span", null, "Data snapshot " + exp.snapshot));
  h.append(snap);
  return h;
}

function renderTiles(exp) {
  const grid = el("section", "tiles");
  for (const t of exp.tiles) {
    const tile = el("div", "tile" + (t.hero ? " hero" : ""));
    tile.append(el("span", "label", t.label));
    tile.append(el("span", "value", t.value));
    if (t.delta) tile.append(el("span", "delta", t.delta));
    if (t.detail) tile.append(el("span", "detail", t.detail));
    grid.append(tile);
  }
  return grid;
}

function renderExplainer(exp) {
  const c = el("section", "card explain");
  c.append(el("h2", null, exp.explainer.title || "What is this experiment?"));
  for (const para of exp.explainer.paragraphs || []) { const p = el("p"); mdBold(p, para); c.append(p); }
  if (exp.explainer.chips) {
    const chips = el("div", "chips");
    for (const ch of exp.explainer.chips) chips.append(el("span", "chip", ch));
    c.append(chips);
  }
  return c;
}

function renderFleet(exp) {
  const sec = el("section");
  const grid = el("div", "fleet");
  for (const f of exp.fleet) {
    const sm = exp.series_meta.find(m => m.key === f.key) || { name: f.key, color_slot: 1 };
    const color = slotVar(sm.color_slot);
    const c = el("div", "arm-card");
    const head = el("div", "arm-head");
    head.append(keySpan(color, "arm-key"), el("span", "arm-name", sm.name));
    if (f.state) head.append(el("span", "state-pill" + (/train|run/i.test(f.state) ? " run" : ""), f.state));
    c.append(head);
    if (sm.label) c.append(el("div", "arm-meta", sm.label));
    const jm = el("div", "arm-meta");
    if (f.job) { jm.append("job "); jm.append(el("span", "mono", String(f.job))); }
    if (f.metric_label) jm.append((f.job ? " · " : "") + f.metric_label);
    if (jm.textContent) c.append(jm);
    if (f.step != null && exp.step_target) {
      const meter = el("div", "meter");
      const track = keySpan(color, "fill"); track.style.width = "100%"; track.style.opacity = "var(--track-alpha)";
      const fill = keySpan(color, "fill"); fill.style.width = Math.min(100, Math.round(100 * f.step / exp.step_target)) + "%";
      meter.append(track, fill); c.append(meter);
      const cap = el("div", "meter-cap");
      cap.append(el("span", null, "step " + f.step + " / " + exp.step_target));
      cap.append(el("span", null, Math.min(100, Math.round(100 * f.step / exp.step_target)) + "%"));
      c.append(cap);
    }
    if (f.note) c.append(el("div", "arm-meta", f.note));
    grid.append(c);
  }
  sec.append(grid);
  return sec;
}

function renderCharts(exp) {
  const frag = document.createDocumentFragment();
  const charts = exp.charts === "rl_default" || !exp.charts ? RL_CHARTS : exp.charts;
  const big = charts.filter(c => c.big), small = charts.filter(c => !c.big);
  for (const spec of big) {
    const c = el("section", "card");
    c.append(el("h2", null, spec.title));
    if (spec.how) { const p = el("p", "how"); mdBold(p, spec.how); c.append(p); }
    c.append(legendRow(exp, true));
    const holder = el("div", "chart-holder");
    holder.tabIndex = 0; holder.setAttribute("role", "img"); holder.setAttribute("aria-label", spec.title);
    c.append(holder);
    frag.append(c);
    lineChart(holder, exp, { ...spec, evals: spec.evals || (exp.evals || []).filter(e => (e.chart || charts[0].field) === spec.field) });
  }
  if (small.length) {
    const sec = el("section");
    sec.append(legendRow(exp, false));
    const grid = el("div", "smalls");
    for (const spec of small) {
      const c = el("div", "card");
      c.append(el("h2", null, spec.title));
      if (spec.how) { const p = el("p", "how"); mdBold(p, spec.how); c.append(p); }
      const holder = el("div", "chart-holder");
      holder.tabIndex = 0; holder.setAttribute("role", "img"); holder.setAttribute("aria-label", spec.title);
      c.append(holder);
      grid.append(c);
      lineChart(holder, exp, spec);
    }
    sec.append(grid);
    frag.append(sec);
  }
  return frag;
}

function renderGlossary(exp) {
  const gl = exp.glossary === "rl_default" ? RL_GLOSSARY : exp.glossary;
  const c = el("section", "card");
  c.append(el("h2", null, "The metrics, in plain language"));
  c.append(el("p", "how", "Every dashboard panel, translated. Healthy ranges are for this kind of run."));
  const grid = el("div", "gloss");
  for (const g of gl) {
    const item = el("div", "g-item");
    const h = el("h3", null, g.term);
    if (g.wkey) h.append(el("span", "wkey", g.wkey));
    item.append(h);
    const p = el("p"); mdBold(p, g.text); item.append(p);
    grid.append(item);
  }
  c.append(grid);
  return c;
}

function renderTimeline(exp) {
  const c = el("section", "card");
  c.append(el("h2", null, exp.timeline.title || "Job timeline"));
  if (exp.timeline.how) { const p = el("p", "how"); mdBold(p, exp.timeline.how); c.append(p); }

  const counts = {};
  for (const key of Object.keys(exp.attempts)) for (const at of exp.attempts[key])
    if (at.fate !== "run" && at.fate !== "done") counts[at.fate] = (counts[at.fate] || 0) + 1;
  const fates = el("div", "fates");
  for (const k of Object.keys(counts)) {
    const f = FATES[k] || FATES.fail;
    const chip = el("span", "fate-chip");
    const dot = el("span", "dot"); dot.style.background = f.color;
    chip.append(dot, el("span", "glyph", f.glyph), el("span", null, f.label + " "), el("b", null, String(counts[k])));
    fates.append(chip);
  }
  c.append(fates);

  const holder = el("div", "chart-holder");
  holder.setAttribute("role", "img"); holder.setAttribute("aria-label", "Timeline of job attempts per run");
  c.append(holder);

  const keys = exp.series_meta.filter(m => exp.attempts[m.key]);
  const W = 1000, rowH = 44, M = { l: 64, r: 20, t: 26, b: 8 };
  const H = M.t + rowH * keys.length + M.b;
  const T0 = mins(exp.timeline.t0), T1 = mins(exp.timeline.t1), NOW = mins(exp.timeline.now || exp.timeline.t1);
  const x = t => M.l + (W - M.l - M.r) * (t - T0) / (T1 - T0);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" });
  const tickEvery = exp.timeline.tick_min || 120;
  for (let t = T0; t <= T1; t += tickEvery) {
    svg.append(svgEl("line", { x1: x(t), x2: x(t), y1: M.t - 4, y2: H - M.b, class: "gridline" }));
    const lb = svgEl("text", { x: x(t), y: 14, "text-anchor": "middle", class: "tick" });
    lb.textContent = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
    svg.append(lb);
  }
  keys.forEach((sm, i) => {
    const cy = M.t + rowH * i + rowH / 2;
    const color = slotVar(sm.color_slot);
    const lb = svgEl("text", { x: M.l - 10, y: cy + 4, "text-anchor": "end", class: "endlabel" });
    lb.textContent = sm.name; svg.append(lb);
    exp.attempts[sm.key].forEach((at, j) => {
      const s = mins(at.start), e = at.end ? mins(at.end) : NOW;
      const bx = x(s), bw = Math.max(x(Math.max(e, s + 6)) - bx, 4);
      const bar = svgEl("rect", { x: bx, y: cy - 7, width: bw, height: 14, rx: 3, fill: color });
      if (at.fate !== "run") bar.setAttribute("opacity", "0.55");
      svg.append(bar);
      const f = FATES[at.fate] || FATES.fail;
      svg.append(svgEl("circle", { cx: bx + bw, cy, r: 5, fill: f.color, stroke: "var(--surface)", "stroke-width": 2 }));
      const hit = svgEl("rect", { x: bx - 6, y: cy - rowH / 2, width: bw + 18, height: rowH, fill: "transparent" });
      hit.dataset.key = sm.key; hit.dataset.i = j;
      svg.append(hit);
    });
  });
  holder.append(svg);
  const tt = el("div", "tt");
  holder.append(tt);
  svg.addEventListener("pointermove", e => {
    const t = e.target;
    if (!(t instanceof SVGRectElement) || t.dataset.key == null) { tt.style.display = "none"; return; }
    const sm = exp.series_meta.find(m => m.key === t.dataset.key);
    const at = exp.attempts[t.dataset.key][+t.dataset.i];
    const f = FATES[at.fate] || FATES.fail;
    tt.textContent = "";
    tt.append(el("div", "tt-step", sm.name + " " + (at.v || "") + (at.job ? " · job " + at.job : "")));
    const r1 = el("div", "row");
    const d = keySpan(f.color); d.style.height = "8px"; d.style.width = "8px"; d.style.borderRadius = "50%";
    r1.append(d, el("span", "val", f.glyph + " " + f.label));
    tt.append(r1);
    tt.append(el("div", "row", at.start + "–" + (at.end || "now") + (at.steps ? " · steps " + at.steps : "")));
    if (at.note) { const note = el("div", "row", at.note); note.style.maxWidth = "260px"; tt.append(note); }
    const hr = holder.getBoundingClientRect();
    tt.style.display = "block";
    tt.style.left = Math.min(e.clientX - hr.left + 12, hr.width - 290) + "px";
    tt.style.top = (e.clientY - hr.top + 14) + "px";
  });
  svg.addEventListener("pointerleave", () => { tt.style.display = "none"; });

  const det = el("details");
  det.append(el("summary", null, "All attempts as a table"));
  const wrap = el("div", "tbl-wrap"), tbl = el("table");
  const thr = el("tr");
  for (const h of ["Run", "Try", "Job", "Window", "Steps", "Outcome", "What happened"]) thr.append(el("th", null, h));
  tbl.append(thr);
  for (const sm of keys) for (const at of exp.attempts[sm.key]) {
    const tr = el("tr");
    tr.append(el("td", null, sm.name));
    tr.append(el("td", "num", at.v || ""));
    tr.append(el("td", "num", at.job || "—"));
    tr.append(el("td", "num", at.start + "–" + (at.end || "now")));
    tr.append(el("td", "num", at.steps || "—"));
    const f = FATES[at.fate] || FATES.fail;
    const td = el("td");
    const dot = el("span", "fdot"); dot.style.background = f.color;
    td.append(dot, document.createTextNode(f.glyph + " " + f.label));
    tr.append(td);
    tr.append(el("td", null, at.note || ""));
    tbl.append(tr);
  }
  wrap.append(tbl); det.append(wrap); c.append(det);
  return c;
}

function renderStepTable(exp) {
  const charts = exp.charts === "rl_default" || !exp.charts ? RL_CHARTS : exp.charts;
  const primary = charts[0];
  const c = el("section", "card");
  c.append(el("h2", null, "Per-step values"));
  c.append(el("p", "how", "The stitched numbers behind the charts (latest attempt wins where a resume replayed a step) — the no-hover way to read any value."));
  const det = el("details");
  det.append(el("summary", null, "Open the full table"));
  const wrap = el("div", "tbl-wrap"), tbl = el("table");
  const thr = el("tr");
  thr.append(el("th", null, "Step"));
  for (const sm of exp.series_meta) thr.append(el("th", null, sm.name + " " + primary.field));
  tbl.append(thr);
  const idx = {};
  for (const sm of exp.series_meta) { idx[sm.key] = {}; for (const r of exp.series_data[sm.key] || []) idx[sm.key][r.step] = r; }
  const steps = [...new Set(Object.values(idx).flatMap(m => Object.keys(m).map(Number)))].sort((a, b) => a - b);
  for (const s of steps) {
    const tr = el("tr");
    tr.append(el("td", "num", String(s)));
    for (const sm of exp.series_meta) {
      const r = idx[sm.key][s];
      tr.append(el("td", "num", r && r[primary.field] != null ? fmt(r[primary.field], primary.dp) : "—"));
    }
    tbl.append(tr);
  }
  wrap.append(tbl); det.append(wrap); c.append(det);
  return c;
}

function renderFooter(exp) {
  const f = el("footer");
  for (const n of exp.notes || []) {
    const p = el("p");
    if (n.lead) { p.append(el("b", null, n.lead + " ")); }
    mdBold(p, n.text);
    f.append(p);
  }
  return f;
}

function render(exp) {
  const app = document.getElementById("app");
  app.textContent = "";
  const stack = el("div", "wrap"); stack.style.padding = "0"; stack.style.maxWidth = "none";
  stack.append(renderHeader(exp));
  if (exp.tiles && exp.tiles.length) stack.append(renderTiles(exp));
  if (exp.explainer) stack.append(renderExplainer(exp));
  if (exp.fleet && exp.fleet.length) stack.append(renderFleet(exp));
  stack.append(renderCharts(exp));
  if (exp.glossary) stack.append(renderGlossary(exp));
  if (exp.attempts && exp.timeline) stack.append(renderTimeline(exp));
  if (exp.series_meta.length && Object.keys(exp.series_data || {}).length) stack.append(renderStepTable(exp));
  stack.append(renderFooter(exp));
  app.append(stack);
}

/* ---------- experiment registry, selector, loaders ---------- */
const LS_KEY = "runboard_user_exps";
let userExps = [];
try { userExps = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { userExps = []; }
function allExps() {
  const seen = {}; const out = [];
  for (const e of [...userExps, ...EXPERIMENTS]) { if (!e || !e.id || seen[e.id]) continue; seen[e.id] = 1; out.push(e); }
  return out;
}
function rebuildSelect(activeId) {
  const sel = document.getElementById("exp-select");
  sel.textContent = "";
  for (const e of allExps()) {
    const o = el("option", null, e.title + (userExps.some(u => u.id === e.id) ? " (loaded)" : ""));
    o.value = e.id;
    sel.append(o);
  }
  if (activeId) sel.value = activeId;
}
function show(id) {
  const e = allExps().find(x => x.id === id) || allExps()[0];
  if (!e) {
    const app = document.getElementById("app");
    app.textContent = "";
    app.append(el("div", "empty", "No experiments bundled. Use “Load JSON…” or drop an experiment file generated by scripts/dashboard/pull_wandb.py."));
    return;
  }
  rebuildSelect(e.id);
  render(e);
}
function addExperiments(objs) {
  let lastId = null;
  for (const o of objs) {
    if (!o || !o.id || !o.series_meta) continue;
    userExps = userExps.filter(u => u.id !== o.id);
    userExps.unshift(o);
    lastId = o.id;
  }
  try { localStorage.setItem(LS_KEY, JSON.stringify(userExps)); } catch (e) { /* quota — keep in memory */ }
  if (lastId) show(lastId);
}
function loadFiles(files) {
  for (const f of files) {
    const rd = new FileReader();
    rd.onload = () => { try { addExperiments([JSON.parse(rd.result)]); } catch (e) { alert("Not a valid experiment JSON: " + f.name); } };
    rd.readAsText(f);
  }
}
document.getElementById("exp-select").addEventListener("change", e => show(e.target.value));
document.getElementById("load-btn").addEventListener("click", () => document.getElementById("load-input").click());
document.getElementById("load-input").addEventListener("change", e => { loadFiles(e.target.files); e.target.value = ""; });
window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dropping"); });
window.addEventListener("dragleave", e => { if (e.target === document.body || e.relatedTarget == null) document.body.classList.remove("dropping"); });
window.addEventListener("drop", e => {
  e.preventDefault(); document.body.classList.remove("dropping");
  if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
});

show(null);
</script>
