name: opencode
version: 1.18.8
preinstalled: true
prompt_template_path: /e/scratch/reformo/lee27/OpenThoughts-Agent-r2egym-bridge-next/eval/jureca/opencode_swebench_prompt.md.j2
opencode_config:
  autoupdate: false
  compaction:
    auto: true
enable_summarize: false
store_all_messages: true
trajectory_config:
  raw_content: true
upload_agent_logs: false
enable_episode_logging: false
record_terminal_session: false
enable_pane_logging: false
override_timeout_sec: 1800
override_cpus: 2
override_memory_mb: 4096
override_storage_mb: 4096
environment_type: apptainer
sif_cache: /p/scratch/synthlaion/lee27/r2egym_sif
auto_snapshot: false
verifier_override_timeout_sec: 120
max_retries: 3
min_wait_sec: 60.0
max_wait_sec: 600.0
wait_multiplier: 2.0
exclude_exceptions:
- VerifierTimeoutError
- VerifierRuntimeError
- RewardFileNotFoundError
- RewardFileEmptyError
- VerifierOutputParseError
- BridgeOutageError
- BridgeOperationError
- BridgeOperationTimeoutError
- VerifierInfrastructureError
- ContextLengthExceededError
- NonZeroAgentExitCodeError
log_level: INFO
enable_reward_shaping: false
collect_rollout_details: true
enable_error_classification: true
mask_exceptions:
- DaytonaError
- EnvironmentStartTimeoutError
- BridgeOutageError
- BridgeOperationError
- BridgeOperationTimeoutError
- VerifierInfrastructureError
- NetworkError
- ConnectionError
- RewardFileNotFoundError
- RewardFileEmptyError
- AgentEnvironmentTimeoutError
- ContextLengthExceededError
- AddTestsDirError
default_error_treatment: mask
passthrough_exceptions:
- AgentTimeoutError
- ContextLengthExceededError
- NonZeroAgentExitCodeError

# THINKING OFF. Not a tuning knob -- the second of the two independent causes of
# the one-step no-op, and the one that keeps coming back.
#
# base8b.yaml ships thinking ON. a42199f5 turned it off by editing the SHARD
# yamls, then ca3d56f7 replaced the whole harbor block with this file, which
# carried neither key -- so Qwen3's template defaulted thinking back ON and every
# episode ended after ONE step: the model emitted a short <think> as plain TEXT
# (~300 tokens, so not a 4096 truncation) and never produced a tool call at all.
# b361f179 fixed it again by hand-editing one shard yaml, so a freshly GENERATED
# config still regressed. Fixing it HERE is what makes the generator's output
# correct by construction.
#
# The two causes are independent and BOTH are required:
#   thinking off      -> the model actually emits its bare-JSON tool call
#   bare_json parser  -> vLLM recognises that call instead of passing it through
#                        as assistant text (see BAND_TOOL_PARSER in gen_band_yaml.py)
interleaved_thinking: false
extra_body:
  chat_template_kwargs:
    enable_thinking: false
