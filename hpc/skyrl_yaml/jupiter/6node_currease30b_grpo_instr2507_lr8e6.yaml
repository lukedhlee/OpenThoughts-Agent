entrypoint: examples.terminal_bench.entrypoints.main_tbench

config_groups:
  terminal_bench_config: terminal_bench

terminal_bench:
  trials_dir: null
  harbor:
    name: terminus-2
    max_episodes: 999999
    enable_summarize: false
    store_all_messages: true
    trajectory_config:
      raw_content: true
    enable_episode_logging: false
    record_terminal_session: false
    enable_pane_logging: false
    strict_json_parser: true
    override_timeout_sec: 1800
    override_cpus: 2
    override_memory_mb: 4096
    override_storage_mb: 4096
    auto_snapshot: true
    verifier_override_timeout_sec: 120
    max_retries: 3
    min_wait_sec: 60.0
    max_wait_sec: 600.0
    wait_multiplier: 2.0
    exclude_exceptions:
      - VerifierTimeoutError
      - VerifierRuntimeError
      - RewardFileNotFoundError
      - RewardFileEmptyError
      - VerifierOutputParseError
    n_concurrent_trials: 64
    log_level: INFO
    enable_reward_shaping: false
    collect_rollout_details: true
    enable_error_classification: true
    mask_exceptions:
      - DaytonaError
      - EnvironmentStartTimeoutError
      - NetworkError
      - ConnectionError
      - RewardFileNotFoundError
      - RewardFileEmptyError
      - AgentEnvironmentTimeoutError
      - ContextLengthExceededError
    default_error_treatment: zero
    passthrough_exceptions:
      - AgentTimeoutError
      - ContextLengthExceededError
  model_info:
    max_input_tokens: 28672
    max_output_tokens: 4096
  archiving:
    enabled: false
  trace_upload:
    enabled: false

trainer:
  strategy: fsdp2
  flash_attn: true
  use_sample_packing: true
  attn_backend: auto
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: true
  algorithm:
    advantage_estimator: grpo
    use_kl_loss: true
    kl_loss_coef: 0.001
    eps_clip_low: 0.2
    eps_clip_high: 0.28
    loss_reduction: sequence_mean
    use_tis: true
    tis_imp_ratio_cap: 2.0

  epochs: 5
  max_steps: 50
  update_epochs_per_batch: 1

  train_batch_size: 16
  policy_mini_batch_size: 16
  eval_batch_size: 32

  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1

  max_prompt_length: 28672

  eval_interval: 999999
  eval_before_train: false
  seed: 42
  ckpt_interval: 5
  resume_mode: null
  hf_save_interval: 999999
  hf_hub_repo_id: null
  hf_hub_private: false
  hf_hub_revision: main

  diag_group_metrics: true
  dump_train_rollouts: true

  enable_db_registration: false

  project_name: jupiter-currease30b-grpo
  log_level: INFO
  tracker_commit_each_step: true
  logger: wandb

  run_name: null
  ckpt_path: null
  export_path: null

  policy:
    model:
      path: /e/fscratch/reformo/lee27/hf_hub/models--Qwen--Qwen3-30B-A3B-Instruct-2507/snapshots/0d7cf23991f47feeb3a57ecb4c9cee8ea4a17bfe
    optimizer_config:
      lr: 8.0e-6
      weight_decay: 0.01
      adam_betas: [0.9, 0.999]
      max_grad_norm: 1.0
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true
      fsdp_size: 4
      expert_model_parallel_size: 4
      moe_router_replay: false
      moe_grouped_gemm: true
      ep_comm_backend: torch
  ref:
    model:
      path: /e/fscratch/reformo/lee27/hf_hub/models--Qwen--Qwen3-30B-A3B-Instruct-2507/snapshots/0d7cf23991f47feeb3a57ecb4c9cee8ea4a17bfe
    fsdp_config:
      cpu_offload: true
      reshard_after_forward: true
      fsdp_size: 4
      expert_model_parallel_size: 4
      moe_router_replay: false
      moe_grouped_gemm: true
      ep_comm_backend: torch

  placement:
    colocate_all: false
    colocate_policy_ref: true
    policy_num_nodes: 4
    ref_num_nodes: 4
    policy_num_gpus_per_node: 4
    ref_num_gpus_per_node: 4
    critic_num_nodes: 1
    critic_num_gpus_per_node: 4
    policy_strict_spread_pg: true
    policy_per_gpu_bundles: true
    policy_force_cvd_mask: true

generator:
  backend: vllm
  timeout_multiplier: 1.0
  model_dtype: bfloat16
  enforce_eager: false

  inference_engine_tensor_parallel_size: 1
  num_inference_engines: 8
  inference_engine_expert_parallel_size: 1

  n_samples_per_prompt: 8
  eval_n_samples_per_prompt: 1

  gpu_memory_utilization: 0.85

  max_num_seqs: 8
  max_num_batched_tokens: 4096

  enable_prefix_caching: true
  enable_chunked_prefill: true

  run_engines_locally: true
  weight_sync_backend: nccl
  async_engine: true
  batched: false
  enable_http_endpoint: true
  enable_ray_prometheus_stats: false
  vllm_stats_interval: 1
  append_eos_token_after_stop_str_in_multi_turn: true
  max_turns: 999999

  sampling_params:
    max_generate_length: 4096
    temperature: 1.0
    top_p: 1.0
    top_k: -1

  engine_init_kwargs:
    max_model_len: 32768
    moe_backend: triton

data:
  train_data: []
  val_data: []

rollout:
  fanout:
    enabled: true
    num_coordinators: 4
    cpus_per_coordinator: 8

container:
  extra_env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    VLLM_CACHE_ROOT: /e/fscratch/reformo/lee27/cache/vllm
    XDG_CACHE_HOME: /e/fscratch/reformo/lee27/cache/xdg
    TRITON_CACHE_DIR: /e/fscratch/reformo/lee27/cache/triton
    TORCHINDUCTOR_CACHE_DIR: /e/fscratch/reformo/lee27/cache/inductor
    FLASHINFER_WORKSPACE_BASE: /e/fscratch/reformo/lee27/cache/flashinfer
    NCCL_DEBUG: WARN
    SKYRL_WORKER_NCCL_TIMEOUT_IN_S: "1800"
    VLLM_ATTENTION_BACKEND: FLASH_ATTN
    VLLM_FORCE_IPV4: "1"
    GLOO_USE_IPV6: "0"
    NCCL_SOCKET_FAMILY: AF_INET
    WANDB_PROJECT: jupiter-currease30b-grpo
    WANDB_MODE: offline
    WANDB_DIR: /e/fscratch/reformo/lee27/wandb
    DC_AGENT_SECRET_ENV: /e/fscratch/reformo/lee27/keys/secrets.env
    RL_REPO_DIR: /e/fscratch/reformo/lee27/repos/MarinSkyRL
    SKYRL_HOME: /e/fscratch/reformo/lee27/repos/MarinSkyRL
    CONDA_EXE: /e/scratch/reformo/lee27/miniforge3/bin/conda
    RL_ENV_DIR: /e/fscratch/reformo/lee27/envs/rl-fa
    DCFT_RL_ENV: /e/fscratch/reformo/lee27/envs/rl-fa
    RL_PYTHON: /e/fscratch/reformo/lee27/envs/rl-fa/bin/python
    LD_LIBRARY_PATH: /e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cu13/cccl/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cu13/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cublas/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cuda_cupti/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cuda_nvrtc/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cudnn/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cufft/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cufile/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/curand/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cusolver/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cusparse/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/cusparselt/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/nccl/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/nvjitlink/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/nvshmem/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/nvidia/nvtx/lib:/e/fscratch/reformo/lee27/envs/rl-fa/lib/python3.12/site-packages/torch/lib:${LD_LIBRARY_PATH:-}
    PYTHONPATH: /e/fscratch/reformo/lee27/repos/MarinSkyRL/skyrl-train:/e/fscratch/reformo/lee27/repos/MarinSkyRL/skyrl-gym:/e/fscratch/reformo/lee27/repos/OpenThoughts-Agent
