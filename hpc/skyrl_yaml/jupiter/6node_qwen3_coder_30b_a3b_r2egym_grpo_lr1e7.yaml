# Context budget is the single public context declaration (upstream rl_config_utils derives
# trainer.max_prompt_length / generator.* / terminal_bench.* from it and rejects them if set).
# 40k window, 24k per turn (~16k in) — matched to the co-lead's r2egym budget
# (40960 / in 15384 / out 24576); the old 4k turn cap let thinking eat whole turns.
context_budget:
  request_window_tokens: 40960
  max_new_tokens_per_turn: 24576
  max_turns: 999999

# MarinSkyRL main removed examples/terminal_bench (PR #386, 2026-08-15); the packaged entrypoint is the replacement.
entrypoint: skyrl_train.entrypoints.terminal_bench

# r2egym agentic GRPO on Qwen/Qwen3-Coder-30B-A3B-Instruct (non-thinking coder MoE)
# over the apptainer
# bridge — 6 nodes / 24 GPU, FSDP2 EP=4, flash_attn + sample packing. Trainer/
# generator/placement mirror 6node_currease30b_grpo_base.yaml (validated on
# this stack); the harbor block is the archived r2egym setup switched from
# Daytona to environment_type: apptainer. The bridge address comes from
# APPTAINER_BRIDGE_URL in the environment (set it in hpc/dotenv/jupiter.local.env);
# SIF resolution is worker-side. Train data: DCAgent/r2egym-patched-full-oracle
# (passed at launch). lr is the post-#452 equivalent of the archived 1e-6 —
# re-sweep before trusting it. n_samples_per_prompt is 8, not the archived 4:
# the co-lead's validated r2egym recipe filters at k=4 but TRAINS at n=8;
# n=4 gives P(within-group variance) 0.48 vs 0.73 at n=8 at p=0.15.

config_groups:
  terminal_bench_config: terminal_bench

terminal_bench:
  trials_dir: null
  harbor:
    name: terminus-2
    environment_type: apptainer
    enable_summarize: false
    store_all_messages: true
    trajectory_config:
      raw_content: true
    enable_episode_logging: false
    record_terminal_session: false
    enable_pane_logging: false
    strict_json_parser: true
    interleaved_thinking: false
    override_timeout_sec: 1800
    override_cpus: 2
    override_memory_mb: 4096
    override_storage_mb: 4096
    verifier_override_timeout_sec: 120
    max_retries: 3
    min_wait_sec: 60.0
    max_wait_sec: 600.0
    wait_multiplier: 2.0
    exclude_exceptions:
      - VerifierTimeoutError
      - VerifierRuntimeError
      - RewardFileNotFoundError
      - RewardFileEmptyError
      - VerifierOutputParseError
    n_concurrent_trials: 128
    log_level: INFO
    enable_reward_shaping: false
    collect_rollout_details: true
    enable_error_classification: true
    mask_exceptions:
      - BridgeOutageError
      - BridgeOperationError
      - VerifierInfrastructureError
      - EnvironmentStartTimeoutError
      - NetworkError
      - ConnectionError
      - RewardFileNotFoundError
      - RewardFileEmptyError
      - AgentEnvironmentTimeoutError
      - ContextLengthExceededError
    default_error_treatment: zero
    passthrough_exceptions:
      - AgentTimeoutError
      - ContextLengthExceededError
  model_info:
  archiving:
    enabled: false
  trace_upload:
    enabled: false

trainer:
  strategy: fsdp2
  flash_attn: true
  use_sample_packing: true
  attn_backend: auto
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: true
  algorithm:
    advantage_estimator: grpo
    use_kl_loss: false
    kl_loss_coef: 0.0
    eps_clip_low: 0.2
    eps_clip_high: 0.2
    loss_reduction: sequence_mean
    use_tis: true
    tis_imp_ratio_cap: 2.0

  epochs: 1
  max_steps: 200
  update_epochs_per_batch: 1

  train_batch_size: 32
  policy_mini_batch_size: 32
  eval_batch_size: 32

  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1

  eval_interval: 10
  eval_before_train: true
  seed: 42
  ckpt_interval: 20
  resume_mode: latest
  hf_save_interval: 20
  hf_hub_repo_id: null
  hf_hub_private: false
  hf_hub_revision: main

  diag_group_metrics: true
  dump_train_rollouts: true

  enable_db_registration: false

  project_name: jupiter-r2egym-grpo
  log_level: INFO
  tracker_commit_each_step: true
  logger: wandb

  run_name: null
  ckpt_path: null
  export_path: null

  policy:
    model:
      path: Qwen/Qwen3-Coder-30B-A3B-Instruct
    optimizer_config:
      lr: 1.0e-7
      weight_decay: 0.0
      adam_betas: [0.9, 0.999]
      max_grad_norm: 1.0
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true
      fsdp_size: 4
      expert_model_parallel_size: 4
      moe_router_replay: false
      moe_grouped_gemm: true
      ep_comm_backend: torch
  ref:
    model:
      path: Qwen/Qwen3-Coder-30B-A3B-Instruct
    fsdp_config:
      cpu_offload: true
      reshard_after_forward: true
      fsdp_size: 4
      expert_model_parallel_size: 4
      moe_router_replay: false
      moe_grouped_gemm: true
      ep_comm_backend: torch

  placement:
    colocate_all: false
    colocate_policy_ref: true
    policy_num_nodes: 4
    ref_num_nodes: 4
    policy_num_gpus_per_node: 4
    ref_num_gpus_per_node: 4
    critic_num_nodes: 1
    critic_num_gpus_per_node: 4
    policy_strict_spread_pg: true
    policy_per_gpu_bundles: true
    policy_force_cvd_mask: true

generator:
  backend: vllm
  timeout_multiplier: 1.0
  model_dtype: bfloat16
  enforce_eager: false

  inference_engine_tensor_parallel_size: 1
  num_inference_engines: 8
  inference_engine_expert_parallel_size: 1

  n_samples_per_prompt: 8
  eval_n_samples_per_prompt: 2

  gpu_memory_utilization: 0.85

  max_num_seqs: 32
  max_num_batched_tokens: 16384

  enable_prefix_caching: true
  enable_chunked_prefill: true

  run_engines_locally: true
  weight_sync_backend: nccl
  async_engine: true
  batched: false
  enable_http_endpoint: true
  vllm_stats_interval: 1
  append_eos_token_after_stop_str_in_multi_turn: true

  sampling_params:
    temperature: 1.0
    top_p: 0.95
    top_k: 20

  engine_init_kwargs:
    moe_backend: triton
    attention_backend: FLASHINFER

data:
  train_data: []
  val_data: ["/e/fscratch/reformo/lee27/tasks/r2egym-raw-v3-val"]

rollout:
  fanout:
    enabled: true
    num_coordinators: 4
    cpus_per_coordinator: 8

container:
  # Experiment knobs only. Runtime locations (caches, venv, LD_LIBRARY_PATH,
  # secrets, SkyRL checkout, APPTAINER_BRIDGE_URL) come from hpc/dotenv/jupiter.env
  # and the per-user jupiter.local.env overlay.
  extra_env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    NCCL_DEBUG: WARN
    SKYRL_WORKER_NCCL_TIMEOUT_IN_S: "1800"
    VLLM_ATTENTION_BACKEND: FLASHINFER
    FLASHINFER_WORKSPACE_BASE: /e/fscratch/reformo/lee27/cache/flashinfer
    VLLM_FORCE_IPV4: "1"
    GLOO_USE_IPV6: "0"
    NCCL_SOCKET_FAMILY: AF_INET
    WANDB_PROJECT: jupiter-r2egym-grpo
    WANDB_MODE: offline
