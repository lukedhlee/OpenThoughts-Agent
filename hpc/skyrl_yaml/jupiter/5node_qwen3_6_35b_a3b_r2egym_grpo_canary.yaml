entrypoint: examples.terminal_bench.entrypoints.main_tbench

# The launcher materializes every consumer-specific limit from this single
# request contract. Keep the derived trainer/generator/Harbor fields out of the
# YAML so they cannot drift apart.
context_budget:
  request_window_tokens: 32768
  max_new_tokens_per_turn: 4096
  max_turns: 999999
  # Pipeline-validation smoke only. The SERVER still serves the full 32768
  # window (28672 prompt + 4096 output); this is the smaller window ADVERTISED
  # to OpenCode so that its proactive compaction threshold sits far enough
  # below the hard prompt ceiling for one large tool observation to land
  # safely. Harbor derives limit.context = 20480 - 4096 - 1024 = 15360 and
  # OpenCode compacts at context - output = 11264, leaving 17408 tokens of
  # slack against the 28672 ceiling -- more than the largest tool-output jump
  # measured live (11056 tokens, canary r2egym-v1-00005__Bvnfhmh).
  client_window_tokens: 20480

# Exact initialization:
# Qwen/Qwen3.6-35B-A3B @ 995ad96eacd98c81ed38be0c5b274b04031597b0, staged
# verbatim from the hub — no conversion step, no derived checkpoint.
#
# The published checkpoint is a multimodal shell (Qwen3_5MoeForConditionalGeneration:
# 64.6 GiB text tower + 1.6 GiB MTP head + 0.8 GiB vision tower). SkyRL unwraps it
# to the text tower at load time via SKYRL_QWEN3_5_VLM_UNWRAP=1 (its default), a
# pure reference re-point of already-loaded submodules. The matching weight-sync
# name mapping is gated on the same flag, so policy and rollout engines stay in
# lockstep. Cost is ~3.6% extra read per load; a pre-unwrapped on-disk copy would
# cost a second 67 GB artifact to pin and trust.
#
# Intermediate bring-up canary only: 4 policy/ref nodes (16 GH200 GPUs,
# FSDP4 x EP4) plus one rollout node (4 independent TP1 vLLM engines). It
# deliberately collects only 16 prompt groups / 128 trajectories to shorten the
# path to reward, update, sync, and export evidence. Passing this canary does
# not replace the established six-node final gate.
#
# The checkpoint is read from /e/fscratch, not /e/scratch. vLLM loads the 26
# shards SEQUENTIALLY in one stream, so the load is bounded by PER-STREAM read
# bandwidth: /e/scratch delivers 0.056 GiB/s per stream (O_DIRECT, compute
# jpbo-018-14, job 1224678) and /e/fscratch 2.51 GiB/s. Measured end to end on
# the same 1-GPU canary: "Loading weights took 701.12s" from /e/scratch
# (1217900) vs 38.03s from /e/fscratch (1224804) -- 18.4x, ~11 min saved per
# engine.
# ⚠ CORRECTED: checkpoints and HF exports do NOT stay on /e/scratch. That was the
# plan while only the read-only model was staged on fscratch, but /e/scratch is
# inode-exhausted and cannot create files at all (it killed 1221005, 1229343 and
# -- via Ray's spill dir -- 1229643), and /p/scratch is NOT MOUNTED on Jupiter
# compute. So the experiments tree, checkpoints, HF exports, WANDB_DIR and the
# Ray spill dir are ALL on /e/fscratch now (ae180c37, 31cd646d).
# fscratch retention/purge policy remains UNDOCUMENTED, so the on-disk export is
# NOT durable -- publishing is a deliberate follow-up step, not a side effect.

config_groups:
  terminal_bench_config: terminal_bench

terminal_bench:
  trials_dir: null
  harbor:
    name: opencode
    version: 1.18.8
    preinstalled: true
    prompt_template_path: /e/scratch/reformo/lee27/OpenThoughts-Agent-r2egym-bridge-next/eval/jureca/opencode_swebench_prompt.md.j2
    opencode_config:
      autoupdate: false
      compaction:
        # Pipeline-validation smoke only; formal evaluation remains no-summary.
        # NOTE: do NOT add `reserved:` here. OpenCode 1.18.8 accepts the key,
        # Harbor deep-merges it, and it is written to opencode.json -- but
        # OpenCode never reads it, so it is dead configuration that silently
        # buys no headroom (measured: canary r2egym-v1-00005__Bvnfhmh still
        # overflowed at 28673 with reserved=16384 set). The compaction
        # threshold is moved via context_budget.client_window_tokens instead.
        auto: true
    enable_summarize: false
    store_all_messages: true
    trajectory_config:
      raw_content: true
    # The host-side trace is authoritative. Re-uploading agent logs into the
    # remote sandbox is unused by training and can park failed trials in Harbor's
    # 60-600s retry backoff, starving the rollout engines.
    upload_agent_logs: false
    enable_episode_logging: false
    record_terminal_session: false
    enable_pane_logging: false
    override_timeout_sec: 1800
    override_cpus: 2
    override_memory_mb: 4096
    override_storage_mb: 4096
    environment_type: apptainer
    bridge_url: ${oc.env:APPTAINER_BRIDGE_URL,http://10.128.1.2:9920}
    sif_cache: /p/scratch/synthlaion/lee27/r2egym_sif
    auto_snapshot: false
    verifier_override_timeout_sec: 120
    max_retries: 3
    min_wait_sec: 60.0
    max_wait_sec: 600.0
    wait_multiplier: 2.0
    exclude_exceptions:
      - VerifierTimeoutError
      - VerifierRuntimeError
      - RewardFileNotFoundError
      - RewardFileEmptyError
      - VerifierOutputParseError
      - BridgeOutageError
      - BridgeOperationError
      - BridgeOperationTimeoutError
      - VerifierInfrastructureError
      # Deterministic agent/context failures are canary failures, not reasons
      # to hold a rollout slot across 60/120/240-second retry backoff.
      - ContextLengthExceededError
      - NonZeroAgentExitCodeError
    n_concurrent_trials: 32
    log_level: INFO
    enable_reward_shaping: false
    collect_rollout_details: true
    enable_error_classification: true
    # false since 1229488. It was `true` to stop infrastructure failures becoming
    # training signal -- but that job is already done by `default_error_treatment:
    # mask` below: a masked trial is EXCLUDED from the RLOO baseline and gets
    # advantage 0, so it cannot pollute the gradient whether or not we also abort.
    # What `true` additionally did was make ONE bad trial fatal to all 128.
    # Measured: 1229488 died at 1h46m holding 68 honest trials because a single
    # unenumerated `AddTestsDirError` hit two trials in the same second (a
    # correlated JURECA-side blip). Aborting a nearly-complete batch over a
    # minority sandbox-setup failure costs far more than it protects.
    # ⚠ The cost of `false`: infra failures now DEGRADE quietly instead of
    # shouting. Watch the per-run exception counts (groupvar.py prints them) --
    # if enough trials mask out, groups fall under rloo_n_min_group_size and
    # contribute zero advantage while still looking like a valid batch.
    fail_on_infrastructure_error: false
    mask_exceptions:
      - DaytonaError
      - EnvironmentStartTimeoutError
      - BridgeOutageError
      - BridgeOperationError
      - BridgeOperationTimeoutError
      - VerifierInfrastructureError
      - NetworkError
      - ConnectionError
      - RewardFileNotFoundError
      - RewardFileEmptyError
      - AgentEnvironmentTimeoutError
      - ContextLengthExceededError
      # Harbor "Failed to add tests directory to <env>" -- the r2egym verifier
      # fixture could not be staged into the sandbox. This is infrastructure, so
      # it belongs HERE and explicitly NOT in passthrough_exceptions: passthrough
      # would score the trial as a real trajectory (0), and on a task that
      # otherwise scores 1 that fabricates within-group variance -- making a
      # zero-gradient run look like it had learning signal. Enumerated rather
      # than left to the default so the classification is deliberate.
      - AddTestsDirError
    default_error_treatment: mask
    passthrough_exceptions:
      - AgentTimeoutError
      - ContextLengthExceededError
      # A non-zero OpenCode exit is the DOWNSTREAM MANIFESTATION of the two
      # entries above: when the agent hits the server's context ceiling it
      # exits 1. Classified as infrastructure it would take the `mask` path,
      # and _raise_if_fail_loud aborts on ANY masked infrastructure error --
      # so one trial killed all 64 trajectories (measured, Jupiter 1219434:
      # a single 28673 overflow at 11:23:19 aborted the batch six seconds
      # later). Passthrough keeps the trial's real verifier reward, which is
      # the honest outcome: the agent ran out of context and did not solve
      # the task. That is model behaviour, not broken infrastructure.
      # Genuine infrastructure failures (bridge, verifier, network) remain
      # fail-loud via mask_exceptions.
      - NonZeroAgentExitCodeError
  model_info: {}
  archiving:
    enabled: false
  trace_upload:
    enabled: false

trainer:
  strategy: fsdp2
  flash_attn: false
  attn_backend: sdpa
  use_sample_packing: false
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: true
  algorithm:
    advantage_estimator: grpo
    use_kl_loss: false
    kl_loss_coef: 0.0
    eps_clip_low: 0.2
    eps_clip_high: 0.2
    loss_reduction: sequence_mean
    use_tis: true
    tis_imp_ratio_cap: 2.0
  epochs: 1
  max_steps: 1
  update_epochs_per_batch: 1
  # 16 prompt groups x 8 samples = 128 trajectories (see n_samples_per_prompt).
  # History: 32x2 gave 0 of 15 groups with within-group variance (1219434);
  # 16x4 gave 0 of 7 (1221005). Both were run with the agent silently capped at
  # 600s, so 76% of trials were killed mid-task -- see BRIDGE_EXEC_TIMEOUT
  # below. This run is the first with the full 1800s budget AND the co-lead's
  # n=8 group size. 16 groups is the hard valid minimum under FSDP4xEP4
  # fully-async GRPO; train_batch_size counts PROMPTS, so raising n does not
  # disturb the trainer's batch constraints
  # (train_batch_size == policy_mini_batch_size <= num_parallel_generation_workers).
  train_batch_size: 16
  policy_mini_batch_size: 16
  eval_batch_size: 16
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  fully_async:
    num_parallel_generation_workers: 32
    max_buffered_groups: 32
  eval_interval: 999999
  eval_before_train: false
  ckpt_interval: 1
  resume_mode: latest
  hf_save_interval: 1
  hf_upload_mode: all
  hf_hub_repo_id: null
  hf_hub_private: false
  hf_hub_revision: main
  enable_db_registration: false
  project_name: jupiter-r2egym-grpo-qwen36-35b
  log_level: INFO
  tracker_commit_each_step: true
  logger: wandb
  run_name: null
  ckpt_path: null
  export_path: null
  policy:
    model:
      path: /e/fscratch/reformo/lee27/models/Qwen3.6-35B-A3B/995ad96eacd98c81ed38be0c5b274b04031597b0
    optimizer_config:
      lr: 1.0e-6
      weight_decay: 0.0
      adam_betas: [0.9, 0.999]
      max_grad_norm: 1.0
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true
      fsdp_size: 4
      expert_model_parallel_size: 4
      moe_router_replay: false
      moe_grouped_gemm: true
      ep_comm_backend: torch
  ref:
    model:
      path: /e/fscratch/reformo/lee27/models/Qwen3.6-35B-A3B/995ad96eacd98c81ed38be0c5b274b04031597b0
    fsdp_config:
      cpu_offload: false
      reshard_after_forward: true
      fsdp_size: 4
      expert_model_parallel_size: 4
      moe_router_replay: false
      moe_grouped_gemm: true
      ep_comm_backend: torch
  placement:
    colocate_all: false
    colocate_policy_ref: true
    policy_num_nodes: 4
    ref_num_nodes: 4
    policy_num_gpus_per_node: 4
    ref_num_gpus_per_node: 4
    critic_num_nodes: 1
    critic_num_gpus_per_node: 4
    policy_strict_spread_pg: true
    policy_per_gpu_bundles: true
    policy_force_cvd_mask: true

generator:
  backend: vllm
  timeout_multiplier: 1.0
  model_dtype: bfloat16
  enforce_eager: true
  inference_engine_tensor_parallel_size: 1
  num_inference_engines: 4
  inference_engine_expert_parallel_size: 1
  # 8, matching the co-lead's production GRPO group size (TRAIN_BATCH_SIZE=64
  # x n=8 = ~500 rollouts/step across both her raw and filtered arms).
  #
  # Why n=8 and not 4: she builds her learnable band with a CHEAP p@4 filter and
  # then TRAINS at n=8. The wide training group is what makes the cheap filter
  # safe -- a task admitted on a noisy 1-of-4 still gets eight fresh samples at
  # training time. Filtering at k=4 and training at n=4 is the fragile pairing,
  # and n=4 is what we ran. P(within-group variance) at p=0.5 is 0.875 for n=4
  # but 0.992 for n=8; at p=0.15 it is 0.48 vs 0.73.
  #
  # This raises the canary to 16 x 8 = 128 trajectories (was 64), so budget
  # roughly double the rollout wall clock.
  #
  # ⚠ 2026-08-04, AFTER 1229488: temporarily 4, NOT 8. The n=8 reasoning above is
  # sound and should be restored for any run whose purpose is measuring variance.
  # It is not needed now, because 1229488 ANSWERED that question at n=8: three
  # COMPLETE uniform n=8 groups (01068 all-1, 01755 all-1, 05999 all-0) and 0 of
  # 11 groups with within-group variance. More n=8 samples would re-measure a
  # settled result.
  # What forced the change is the WALL, not the science. Jupiter booster is
  # starved (147 nodes drain*, 1 idle*), and `sbatch --test-only` shows ANY
  # walltime >= 3h30m defers to 2026-08-05T12:00, while <= 3h starts the same
  # night. Inside a 3h wall the 16x8 geometry leaves only ~9 min of margin
  # (36 min startup + ~125 min generation at the measured 1.03 trials/min +
  # ~10 min tail = 2h51m), which is not a margin at all. 16x4 = 64 trials fits
  # in ~1h48m, leaving ~72 min.
  # The remaining milestone is the optimizer update / checkpoint / HF export,
  # none of which cares about group size: uniform groups map to advantage 0
  # under `grpo` either way, so the update still executes and still exercises
  # the never-run save path.
  # RESTORE TO 8 once the node starvation clears or a >=4h wall is obtainable.
  n_samples_per_prompt: 4
  eval_n_samples_per_prompt: 1
  gpu_memory_utilization: 0.85
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  enable_prefix_caching: true
  enable_chunked_prefill: true
  run_engines_locally: true
  weight_sync_backend: nccl
  async_engine: true
  batched: false
  enable_http_endpoint: true
  enable_ray_prometheus_stats: false
  vllm_stats_interval: 1
  append_eos_token_after_stop_str_in_multi_turn: true
  sampling_params:
    temperature: 1.0
    top_p: 0.95
    top_k: 20
  # OpenCode always supplies its coding tools with tool_choice="auto". The
  # exact checkpoint's chat template emits Qwen3 XML tool calls
  # (<tool_call><function=...><parameter=...>), which vLLM 0.22 parses with
  # qwen3_coder. Without both fields vLLM rejects every agent request before
  # generation, so this is part of the rollout transport contract.
  engine_init_kwargs:
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_coder

data:
  train_data: []
  val_data: []

rollout:
  fanout:
    enabled: true
    num_coordinators: 4
    cpus_per_coordinator: 8

container:
  extra_env:
    RL_ENV_DIR: /e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron
    LD_LIBRARY_PATH: "/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cu13/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cublas/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cuda_cupti/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cuda_nvrtc/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cudnn/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cufft/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cufile/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/curand/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cusolver/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cusparse/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/cusparselt/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/nccl/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/nvjitlink/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/nvshmem/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/nvidia/nvtx/lib:/e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/lib/python3.12/site-packages/torch/lib:${CUDA_HOME}/lib64"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    NCCL_DEBUG: WARN
    SKYRL_WORKER_NCCL_TIMEOUT_IN_S: "1800"
    # The staged checkpoint is the published Qwen3.6 VLM shell. SkyRL unwraps
    # its text tower in memory, and the same flag enables the matching
    # policy-to-vLLM weight-name mapping.
    SKYRL_QWEN3_5_VLM_UNWRAP: "1"
    # Qwen3.6 has three GDN layers per four-layer block. Its pure-Torch kernel
    # is prohibitively slow at this run's 28k-token prompt length, so absence
    # of the GPU-smoked official FlashQLA kernel must abort model startup.
    SKYRL_GDN_FLASHQLA: "1"
    SKYRL_GDN_FLASHQLA_REQUIRED: "1"
    TILELANG_CACHE_DIR: /e/scratch/reformo/lee27/cache/tilelang/qwen36-flashqla-0.1.2-sm90
    VLLM_FORCE_IPV4: "1"
    GLOO_USE_IPV6: "0"
    NCCL_SOCKET_FAMILY: AF_INET
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    # THE agent budget for OpenCode on the Apptainer bridge -- not
    # agent.override_timeout_sec, which OpenCode never threads into exec().
    # ApptainerEnvironment.exec() falls back to this when the caller passes no
    # timeout, and the worker kills the process at that deadline.
    #
    # Measured on canary 1221005: 19 of 25 trials died at exactly 600s with
    # `Command timed out after 600s` / return_code -1 (19 of 19 exceptions),
    # while override_timeout_sec=1800 sat present-but-unreachable. The agent was
    # cut off mid-task on 76% of trials, which flattens within-group reward
    # variance -- the only variance GRPO consumes.
    #
    # 2100 > the 1800 agent budget ON PURPOSE: the trial layer's
    # asyncio.wait_for(agent.run(), timeout=1800) must be the FIRST deadline to
    # fire, because AgentTimeoutError is `passthrough` and preserves the
    # trajectory, whereas a worker exec kill surfaces as
    # NonZeroAgentExitCodeError. Keep this strictly above override_timeout_sec.
    # Requires harbor >= f44a1170 (before that the 600 was hardcoded).
    BRIDGE_EXEC_TIMEOUT: "2100"
    WANDB_PROJECT: jupiter-r2egym-grpo-qwen36-35b
    WANDB_MODE: offline
    WANDB_DIR: /e/scratch/reformo/lee27/wandb
    # Keep high-cardinality Ray startup logs node-local; the sbatch cleanup trap
    # collects them into the experiment directory. Spill large objects to our
    # writable project scratch instead of a stale user namespace.
    OT_AGENT_RAY_LOG_DIR: /tmp/ray_logs
    RAY_object_spilling_config: '{"type":"filesystem","params":{"directory_path":"/e/fscratch/reformo/lee27/ray_spill"}}'
    DC_AGENT_SECRET_ENV: /e/scratch/reformo/lee27/keys/secrets.env
    # container.extra_env is rendered as Bash exports before Hydra starts, so
    # OmegaConf interpolation syntax is invalid here. The Hydra-side bridge_url
    # above remains environment-resolvable from this concrete export.
    APPTAINER_BRIDGE_URL: http://10.128.1.2:9920
    # JURECA compute nodes cannot route directly to Jupiter's 10.128.x compute
    # network. The Jupiter->JURECA control master reverse-forwards this internal
    # JURECA login address to the per-job vLLM endpoint.
    SKYRL_ROLLOUT_HTTP_ENDPOINT_HOST: jrlogin05i
    SKYRL_ROLLOUT_HTTP_ENDPOINT_PORT: "18000"
    RL_REPO_DIR: /e/scratch/reformo/lee27/MarinSkyRL-apptainer-bridge
    SKYRL_HOME: /e/scratch/reformo/lee27/MarinSkyRL-apptainer-bridge
    CONDA_EXE: /e/scratch/reformo/lee27/miniforge3/bin/conda
    RL_PYTHON: /e/scratch/reformo/lee27/OpenThoughts-Agent/envs/rl-megatron/bin/python
    PYTHONPATH: /e/scratch/reformo/lee27/pydeps/qwen36-flashqla-0.1.2:/e/scratch/reformo/lee27/harbor-apptainer-bridge/src:/e/scratch/reformo/lee27/MarinSkyRL-apptainer-bridge/skyrl-train:/e/scratch/reformo/lee27/MarinSkyRL-apptainer-bridge/skyrl-gym:/e/scratch/reformo/lee27/OpenThoughts-Agent-r2egym-bridge-next
