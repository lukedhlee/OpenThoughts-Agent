patterns:
# Snowball checkpoints (local paths carry "snowball"). Reasoning lives between
# <|start_think|> / <|end_think|>, which no stock vLLM parser knows; the plugin
# routes it to reasoning_content so stock Terminus-2 parses a clean action
# (eval/vllm_plugins/snowball_reasoning_parser.py). Serve geometry below is the
# 30B-A3B stand-in's (same as the 3[02][Bb] entry); the 67B release needs its own.
- match: (?i)snowball
  profiles:
  - default
  trust_remote_code: true
  tensor_parallel_size: 4
  max_model_len: 32768
  swap_space: 32
  reasoning_parser: snowball
  extra_args: --enable-prefix-caching --enforce-eager --reasoning-parser-plugin ${DCFT}/eval/vllm_plugins/snowball_reasoning_parser.py
- match: (?i)qwen3\.5
  profiles:
  - default
  conda_env: otagent2-fix
  trust_remote_code: true
  max_model_len: 32768
  extra_args: --enable-prefix-caching
- match: (?i)(?:32b.*(131k|-lc)|(131k|-lc).*32b)
  profiles:
  - default
  trust_remote_code: true
  tensor_parallel_size: 2
  max_model_len: 131072
  swap_space: 32
  hf_overrides: '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768}}'
  extra_args: --enable-prefix-caching
- match: (?i)3[02][Bb]
  profiles:
  - default
  trust_remote_code: true
  tensor_parallel_size: 4
  max_model_len: 32768
  swap_space: 32
  extra_args: --enable-prefix-caching --enforce-eager
- match: 131k|-lc$
  profiles:
  - default
  trust_remote_code: true
  max_model_len: 131072
  swap_space: 32
  hf_overrides: '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768}}'
  extra_args: --enable-prefix-caching
- match: (?i)32[Bb]
  profiles:
  - gh200
  - gh200-65k
  trust_remote_code: true
  tensor_parallel_size: 1
  max_model_len: 32768
  swap_space: 32
  extra_args: --enable-prefix-caching
- match: .*
  profiles:
  - gh200
  - gh200-65k
  trust_remote_code: true
  tensor_parallel_size: 1
  max_model_len: 32768
  extra_args: --enable-prefix-caching
